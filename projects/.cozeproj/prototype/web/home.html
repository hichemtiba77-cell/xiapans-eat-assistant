<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 字体：标题用圆润展示体 ZCOOL KuaiLe，正文用 Noto Sans SC（CN 代理） -->
  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色：柔和抹茶绿 === */
      --color-primary:              #6E9B77;
      --color-primary-container:    #DCE9DA;
      --color-on-primary:           #FFFFFF;
      /* 点缀色：暖琥珀（蜜豆/鲑鱼）与 樱粉（装饰） */
      --color-accent:               #E5964E;
      --color-accent-container:     #F8E6D0;
      --color-sakura:               #F2BFB8;
      /* === 背景 / 表面：暖米纸色系（surface 保持暖中性） === */
      --color-background:                 #FAF4E8;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFDF8;
      --color-surface-container:          #F4ECDC;
      --color-surface-container-high:     #EFE4D1;
      --color-surface-container-highest:  #E8DAC3;
      /* === 文字：暖棕（不用纯黑，更柔和） === */
      --color-on-surface:           #4A4038;
      --color-on-surface-variant:   #8C8070;
      /* === 功能色 === */
      --color-success:  #7BAE7F;
      --color-error:    #DE7668;
      --color-warning:  #E5A35B;
      /* === 边框：暖米 ghost border === */
      --color-outline:          #D9CDB6;
      --color-outline-variant:  #E8DECB;
      /* === 圆角：圆润可爱 === */
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.375rem;
      --radius-2xl:  1.75rem;
      --radius-full: 9999px;
      /* === 阴影：暖调柔影 === */
      --shadow-card:   0 3px 12px rgba(122, 98, 70, 0.10);
      --shadow-float:  0 14px 30px rgba(122, 98, 70, 0.15);
      --shadow-dialog: 0 26px 52px rgba(122, 98, 70, 0.20);
      /* === 字体 === */
      --font-sans:     "Noto Sans SC", system-ui, -apple-system, sans-serif;
      --font-display:  "ZCOOL KuaiLe", "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <!-- 手绘立绘微动效：呼吸浮动 + 开心跳跃 + 腮红淡入 -->
  <style>
    @keyframes pet-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes pet-breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }
    @keyframes pet-hop {
      0%   { transform: translateY(0) scale(1, 1); }
      30%  { transform: translateY(-22px) scale(0.96, 1.05); }
      55%  { transform: translateY(0) scale(1.06, 0.92); }
      75%  { transform: translateY(-8px) scale(0.99, 1.02); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes cheek-glow {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }
    @keyframes drift-slow {
      0%   { transform: translateY(0) rotate(0deg); }
      50%  { transform: translateY(-10px) rotate(6deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    .pet-float   { animation: pet-float 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
    .pet-breathe { animation: pet-breathe 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
    .pet-hop     { animation: pet-hop 0.7s ease-in-out; }
    .cheek       { animation: cheek-glow 2.6s ease-in-out infinite; }
    .deco-drift  { animation: drift-slow 6s ease-in-out infinite; }

    /* Toast */
    #toast { transition: opacity .25s ease, transform .25s ease; }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 400;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen">

      <span id="toast-text">吧唧吧唧～团子吃得很开心！</span>
    </div>
  </div>

  <script>
    $(function () {
      // 输入框有内容才启用「喂给它」按钮
      var $feedInput = $('#feed-input');
      var $btnFeed = $('#btn-feed');

      function refreshFeedBtn() {
        var hasText = $.trim($feedInput.val()).length > 0;
        $btnFeed.prop('disabled', !hasText);
      }
      $feedInput.on('input', refreshFeedBtn);

      // 快捷饭菜标签 -> 填入输入框并聚焦、启用按钮
      $('.chip-food').on('click', function () {
        $feedInput.val($(this).data('food'));
        refreshFeedBtn();
        $feedInput.focus();
      });

      // 「去喂它」提醒条按钮：聚焦输入框
      $('#btn-go-feed').on('click', function () {
        $feedInput.focus();
        // 视觉反馈：提醒条轻微高亮一下
        $('#meal-reminder').addClass('ring-2', 'ring-accent/40');
        setTimeout(function () { $('#meal-reminder').removeClass('ring-2 ring-accent/40'); }, 600);
      });

      // 喂饭开心反馈（原型不做持久化，仅视觉反馈）：
      // 完整产品中此处应：1) 生成 Meal 记录写入 localStorage；2) 随机生长值 +8~15；
      // 3) 体重回升、刷新饥饿状态；4) 推进进化进度，达阈值播放进化动画；5) 追加日记时间线。
      function showToast(text) {
        $('#toast-text').text(text);
        $('#toast').css({ opacity: 1, transform: 'translate(-50%, 0)' });
        setTimeout(function () {
          $('#toast').css({ opacity: 0, transform: 'translate(-50%, 16px)' });
        }, 2200);
      }

      function doFeed() {
        var food = $.trim($feedInput.val());
        if (!food) { return; }

        // 宠物开心跳跃
        var $sprite = $('#pet-sprite');
        $sprite.removeClass('pet-float').addClass('pet-hop');
        setTimeout(function () {
          $sprite.removeClass('pet-hop').addClass('pet-float');
        }, 720);

        // 按钮短暂反馈
        var $label = $btnFeed.contents().filter(function () { return this.nodeType === 3; });
        $btnFeed.find('i').attr('data-lucide', 'check');
        lucide.createIcons();
        setTimeout(function () {
          $btnFeed.find('i').attr('data-lucide', 'utensils');
          lucide.createIcons();
        }, 900);

        showToast('吧唧吧唧～团子吃了「' + food + '」，好开心！');

        // 进度条演示性微增（原型视觉反馈）
        var $bar = $('#growth-bar');
        var cur = parseFloat($bar.css('width')) / $bar.parent().width() * 100;
        var next = Math.min(100, Math.round(cur) + 3);
        $bar.css('width', next + '%');
        $('#growth-percent').text(next + '%');

        // 清空输入、禁用按钮
        $feedInput.val('');
        refreshFeedBtn();
      }

      $btnFeed.on('click', doFeed);
      $feedInput.on('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doFeed(); }
      });
    });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
