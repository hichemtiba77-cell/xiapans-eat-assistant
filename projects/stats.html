  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

<script>
    $(async function () {
      // ========== 门卫：没登录会被送去 login.html ==========
      const user = await FanFan.requireLogin();
      if (!user) return;
      FanFan.injectNavUser(user);

      const meta = user.user_metadata || {};
      const totalMeals = meta.total_meals || 0;
      const currentStage = FanFan.stageForMeals(totalMeals);

      // ========== 三个统计卡 ==========
      let meals = [];
      try { meals = await FanFan.getMyMeals(500); } catch (e) { console.warn(e.message); }

      $('#stat-streak-num').text(FanFan.streakDays(meals));
      $('#stat-meals-num').text(totalMeals);
      $('#stat-meals-note').text(totalMeals > 0 ? '一起好好吃了 ' + totalMeals + ' 顿饭' : '开始陪它吃第一顿饭吧');
      $('#stat-weight-num').text((meta.weight == null ? FanFan.BASE_WEIGHT : meta.weight).toFixed(2));

      // ========== 阶段进度卡 ==========
      $('#stage-now-name').text('「' + FanFan.STAGES[currentStage].name + '」');
      if (currentStage >= FanFan.STAGES.length - 1) {
        $('#stage-next-wrap').hide();
        $('#stage-final').show();
        $('#stage-progress-bar').css('width', '100%');
      } else {
        const curNeed = FanFan.STAGES[currentStage].needMeals;
        const next = FanFan.STAGES[currentStage + 1];
        $('#stage-next-stage').text('「' + next.name + '」');
        $('#stage-next-meals').text((next.needMeals - totalMeals) + ' 餐');
        const pct = Math.max(0, Math.min(100, Math.round(((totalMeals - curNeed) / (next.needMeals - curNeed)) * 100)));
        $('#stage-progress-bar').css('width', pct + '%');
      }

      // ========== 进化图鉴 ==========
      $('#evolution-count').text('已解锁 ' + (currentStage + 1) + ' / ' + FanFan.STAGES.length);
      function renderEvolution() {
        FanFan.STAGES.forEach(function (s, i) {
          const card = document.getElementById('stage-' + i);
          if (!card) return;
          const unlocked = totalMeals >= s.needMeals;
          const isCurrent = i === currentStage;
          card.dataset.unlocked = unlocked ? 'true' : 'false';
          const art = card.querySelector('.stage-art');
          const lock = card.querySelector('.stage-lock');
          const badge = card.querySelector('.stage-badge');
          const remain = card.querySelector('.stage-remain');
          const need = card.querySelector('.stage-need');
          // 立绘：未解锁就置灰
          if (art) { art.classList.toggle('opacity-45', !unlocked); art.classList.toggle('grayscale', !unlocked); }
          // 锁图标：解锁后隐藏
          if (lock) lock.style.display = unlocked ? 'none' : '';
          // 徽章：已解锁卡显示「已解锁/当前阶段」
          if (badge) {
            if (unlocked) {
              badge.style.display = '';
              badge.className = 'stage-badge inline-flex items-center gap-1 mt-2 px-2 py-0.5 rounded-sm text-xs font-medium ' +
                (isCurrent ? 'bg-primary-container/70 text-primary' : 'bg-success/15 text-success');
              badge.innerHTML = '<i data-lucide="' + (isCurrent ? 'map-pin' : 'check') + '" class="w-3 h-3"></i>' + (isCurrent ? '当前阶段' : '已解锁');
            } else {
              badge.style.display = 'none';
            }
          }
          // 未解锁卡的「还差 N 餐」
          if (remain) {
            remain.style.display = unlocked ? 'none' : '';
            remain.textContent = '还差 ' + (s.needMeals - totalMeals) + ' 餐解锁';
          }
          // 底部小字
          if (need) need.textContent = s.needMeals + ' 餐解锁' + (isCurrent ? ' · 当前' : '');
        });
        lucide.createIcons();
      }
      renderEvolution();

      // ========== 体重曲线（近 7 天，真实数据） ==========
      // 思路：按天取当天最后一餐后的体重；没喂饭的日子沿用前一天的体重
      function weightSeries(mealRows) {
        const asc = mealRows.slice().sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
        const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - 6);
        let carry = FanFan.BASE_WEIGHT;
        asc.forEach(function (m) { if (new Date(m.created_at) < start) carry = Number(m.weight_after); });
        const out = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(start); d.setDate(start.getDate() + i);
          const key = d.toDateString();
          const dayMeals = asc.filter(function (m) { return new Date(m.created_at).toDateString() === key; });
          if (dayMeals.length) carry = Number(dayMeals[dayMeals.length - 1].weight_after);
          out.push({ date: d, weight: carry });
        }
        return out;
      }

      function renderWeightChart(series) {
        const svg = document.getElementById('weight-chart');
        if (!svg || !series.length) return;
        const values = series.map(function (p) { return p.weight; });
        let min = Math.min.apply(null, values), max = Math.max.apply(null, values);
        if (max - min < 0.06) { const mid = (max + min) / 2; min = mid - 0.04; max = mid + 0.04; }
        min -= 0.02; max += 0.02;
        const X0 = 92, X1 = 600, Y_TOP = 40, Y_BOTTOM = 190;
        const xAt = function (i) { return X0 + (X1 - X0) * i / (series.length - 1); };
        const yAt = function (v) { return Y_BOTTOM - (v - min) / (max - min) * (Y_BOTTOM - Y_TOP); };

        let html = '';
        // 三条水平虚线参考线 + 左侧刻度
        [[Y_TOP, max], [(Y_TOP + Y_BOTTOM) / 2, (max + min) / 2], [Y_BOTTOM, min]].forEach(function (t) {
          html += '<line x1="48" y1="' + t[0] + '" x2="612" y2="' + t[0] + '" stroke="#E8DECB" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round"/>';
          html += '<text x="40" y="' + (t[0] + 4) + '" text-anchor="end" font-size="11" fill="#8C8070">' + t[1].toFixed(2) + '</text>';
        });
        // 面积 + 折线
        const pts = series.map(function (p, i) { return xAt(i).toFixed(1) + ' ' + yAt(p.weight).toFixed(1); });
        html += '<path d="M' + pts.join(' L') + ' L' + X1 + ' ' + Y_BOTTOM + ' L' + X0 + ' ' + Y_BOTTOM + ' Z" fill="#6E9B77" fill-opacity="0.10"/>';
        html += '<path d="M' + pts.join(' L') + '" stroke="#6E9B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
        // 数据点
        series.forEach(function (p, i) {
          html += '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(p.weight).toFixed(1) + '" r="5" fill="#FFFDF8" stroke="#6E9B77" stroke-width="3"/>';
        });
        // 最新点数值标注
        const last = series[series.length - 1];
        html += '<text x="' + xAt(series.length - 1).toFixed(1) + '" y="' + (yAt(last.weight) - 14).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#6E9B77">' + last.weight.toFixed(2) + '</text>';
        // X 轴日期标签
        series.forEach(function (p, i) {
          html += '<text x="' + xAt(i).toFixed(1) + '" y="212" text-anchor="middle" font-size="12" fill="#8C8070">' + (p.date.getMonth() + 1) + '/' + p.date.getDate() + '</text>';
        });
        svg.innerHTML = html;
      }

      renderWeightChart(weightSeries(meals));

      // ========== 保留原型的点击交互入口 ==========
      $('#evolution-grid').on('click', '.evolution-stage', function () {
        const stage = $(this).data('stage');
        const unlocked = $(this).data('unlocked');
        console.log('查看进化阶段:', stage, '已解锁:', unlocked);
      });
      $('#weight-chart').on('mouseenter', 'circle', function () {
        console.log('查看体重点:', $(this).attr('cx'), $(this).attr('cy'));
      });
    });

    lucide.createIcons();
  </script>
</body>
